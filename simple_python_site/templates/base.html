<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glamour Beauty{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(135deg, #d4145a, #fbb03b);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .nav-logo:hover {
            transform: scale(1.05);
            transition: transform 0.3s;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .cart-badge {
            background: #ffeb3b;
            color: #333;
            padding: 0.2rem 0.6rem;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4145a, #fbb03b);
            color: white;
            box-shadow: 0 4px 10px rgba(212, 20, 90, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(212, 20, 90, 0.5);
        }

        .btn-secondary {
            background: white;
            color: #d4145a;
            border: 2px solid #d4145a;
        }

        .btn-secondary:hover {
            background: #d4145a;
            color: white;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f8f8f8;
        }

        .product-info {
            padding: 1.2rem;
        }

        .product-brand {
            font-size: 0.85rem;
            color: #d4145a;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.5rem 0;
            color: #333;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d4145a;
            margin: 0.5rem 0;
        }

        .product-category {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            background: #fce4ec;
            color: #d4145a;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .page-title {
            text-align: center;
            color: #333;
            margin: 2rem 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .page-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            margin: 0.5rem 0;
            border-left: 4px solid #c62828;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            margin: 0.5rem 0;
            border-left: 4px solid #2e7d32;
        }

        footer {
            background: linear-gradient(135deg, #d4145a, #fbb03b);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
            .nav-links {
                gap: 1rem;
            }
            .page-title {
                font-size: 1.8rem;
            }
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}" class="nav-logo">✨ Glamour Beauty</a>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('cart') }}">Cart {% if cart_count > 0 %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2024 Glamour Beauty. All rights reserved. | Makeup with Love 💄</p>
    </footer>
</body>
</html>
